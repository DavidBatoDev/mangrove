# Deployment topology (docs/system-design.md §6). Service Dockerfiles are written during the build window.
# Database: Neon Postgres + PostGIS, external (ADR-036). Photos: S3 via the EC2 instance role (ADR-037).
# Run from infra/:  docker compose --env-file ../.env up -d --build
services:
  web:
    build: ../web
    env_file: ../.env
    restart: unless-stopped
    depends_on: [api]

  api:
    build: ../api
    env_file: ../.env
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [web, api]

volumes:
  caddy_data: {}
  caddy_config: {}
