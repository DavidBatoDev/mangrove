# Deployment topology (docs/system-design.md §6). Service Dockerfiles are written during the build window.
# Database: Neon Postgres + PostGIS, external (ADR-036). Photos: S3 via the EC2 instance role (ADR-037).
# Run from infra/:  docker compose --env-file ../.env up -d --build
services:
  web:
    build:
      context: ../web
      args:
        # Public browser keys are inlined at build time (ADR-046); restrict the key to this domain in Google Cloud.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    env_file: ../.env
    environment:
      - API_INTERNAL_URL=http://api:8000
    restart: unless-stopped
    depends_on: [api]

  api:
    build: ../api
    env_file: ../.env
    environment:
      - GMW_TILE_DIR=/data/gmw-tiles
      - GMW_TILE_CACHE=/data/gmw-cache
    volumes:
      # Philippines GMW extent layer built by data/ingest/gmw_tiles.py (ADR-048); read-only.
      - ${GMW_TILE_DIR_HOST:-/opt/bon/gmw-tiles}:/data/gmw-tiles:ro
      # Rendered tiles kept across restarts (ADR-051); owned by the API user (uid 999). infra/deploy.sh creates it.
      - ${GMW_TILE_CACHE_HOST:-/opt/bon/gmw-tile-cache}:/data/gmw-cache
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [web, api]

volumes:
  caddy_data: {}
  caddy_config: {}
